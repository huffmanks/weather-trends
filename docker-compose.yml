services:
  weather-trends:
    build:
      context: .
      dockerfile: Dockerfile
    image: huffmanks/weather-trends:${RELEASE_VERSION:-latest}
    container_name: weather-trends
    ports:
      - "${APP_PORT:-3003}:3000"
    volumes:
      - weather-trends-data:/app/data
      - weather-trends-assets:/app/assets
    restart: unless-stopped

volumes:
  weather-trends-data:
  weather-trends-assets:
